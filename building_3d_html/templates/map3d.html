<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<!--
Building 3D HTML で作成しました。
この地図は MapLibre GL JS を使っています（下記ライセンス）。

{{MAPLIBRE_LICENSE}}
-->
<style>
{{MAPLIBRE_CSS}}
</style>
<style>
:root{
  --bg:#e9ecef; --ground:#dfe3e8; --panel:#fbfcfd; --ink:#1d2733; --muted:#5d6b7a; --line:#d3d9e0;
  --accent:#2f5d8a; --sel:#ffd23f; --sel-line:#d1006f; --rim:#2b3440;
  --font-ui:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font-ui)}
#map{position:absolute;inset:0}
.panel{position:absolute;top:12px;left:12px;width:300px;max-width:calc(100% - 24px);box-sizing:border-box;max-height:calc(100% - 24px);overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px rgb(0 0 0 / .12)}
.sec{padding:12px 16px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line)}
.sec:first-child{border-top:0}
h1{font-size:17px;margin:0;line-height:1.4;overflow-wrap:anywhere}
.sub{font-size:12px;color:var(--muted);margin:0}
.lbl{font-size:11px;color:var(--muted);letter-spacing:.08em}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{flex:1;font:inherit;font-size:12.5px;padding:6px 4px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--panel);font-weight:700}
.row{display:flex;gap:8px;align-items:center}
.row input[type=range]{flex:1}
.num{font-size:12px;color:var(--muted);min-width:3em;text-align:right;font-variant-numeric:tabular-nums}
/* 凡例：左下。たたむ／ひらく。項目が多いときは高さを画面の半分までにして中をスクロール */
.legendBox{position:absolute;left:12px;bottom:28px;width:260px;max-width:calc(100% - 24px);box-sizing:border-box;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px rgb(0 0 0 / .12);display:flex;flex-direction:column}
.legendHead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;font:inherit;font-size:12px;font-weight:700;
  border:0;background:transparent;color:var(--ink);cursor:pointer;text-align:left;border-radius:10px}
.legendHead span{font-weight:400;color:var(--muted)}
.legend{display:flex;flex-direction:column;gap:4px;font-size:12.5px;padding:0 12px 10px;max-height:50vh;overflow:auto}
.legend div{display:flex;align-items:center;gap:8px}
.legend .cnt{margin-left:auto;padding-left:8px;color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.legend .fill{border-top:1px solid var(--line);padding-top:6px;margin-top:2px;color:var(--muted);font-size:11.5px}
.sw{width:14px;height:14px;border-radius:3px;flex:none;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .15)}
.note{font-size:11px;color:var(--muted);line-height:1.6;margin:0}
.side{position:absolute;top:12px;right:56px;width:300px;max-width:calc(100% - 68px);box-sizing:border-box;max-height:calc(100% - 24px);overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--sel-line);border-radius:10px;box-shadow:0 6px 24px rgb(0 0 0 / .14);padding:14px 16px 12px}
.side h2{font-size:15px;margin:0 24px 8px 0}
.side .x{position:absolute;top:6px;right:8px;border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:4px 6px;border-radius:6px}
.side dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:12.5px}
.side dt{color:var(--muted)}
.side dd{margin:0;overflow-wrap:anywhere}
.dim{font:700 12px/29px var(--font-ui)!important;color:#333!important}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div id="map" role="application" aria-label="建物の3D地図"></div>

<div class="panel" id="panel">
  <div class="sec">
    <h1 id="title"></h1>
    <p class="sub" id="count"></p>
  </div>
  <div class="sec">
    <span class="lbl">高さの強調</span>
    <div class="seg" role="group" aria-label="高さの強調">
      <button type="button" data-ex="1" aria-pressed="true">1倍</button>
      <button type="button" data-ex="3" aria-pressed="false">3倍</button>
      <button type="button" data-ex="5" aria-pressed="false">5倍</button>
    </div>
  </div>
  <div class="sec">
    <span class="lbl">背景地図</span>
    <div class="seg" role="group" aria-label="背景地図">
      <button type="button" data-bm="pale" aria-pressed="true">淡色地図</button>
      <button type="button" data-bm="none" aria-pressed="false">なし</button>
    </div>
    <div class="row"><span class="note">濃さ</span><input type="range" id="bmOp" min="0" max="100" value="35" aria-label="背景の濃さ"><span class="num" id="bmOpV">35%</span></div>
    <p class="note" id="bmNote" hidden>背景地図を読み込めませんでした（ネットにつながっていない可能性があります）。建物はそのまま表示されます。</p>
  </div>
</div>

<div class="legendBox">
  <button type="button" class="legendHead" id="legendHead" aria-expanded="true" aria-controls="legend">凡例 <span id="legendTg">たたむ</span></button>
  <div class="legend" id="legend"></div>
</div>

<aside class="side" id="side" hidden aria-live="polite">
  <button type="button" class="x" id="sideX" aria-label="閉じる">×</button>
  <div id="sideBody"></div>
</aside>

<script id="config" type="application/json">{{CONFIG_JSON}}</script>
<script id="data" type="application/json">{{DATA_JSON}}</script>
<script>
{{MAPLIBRE_JS}}
</script>
<script>
const CFG = JSON.parse(document.getElementById('config').textContent);
const DATA = JSON.parse(document.getElementById('data').textContent);
const PITCH_3D = 55;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

document.title = CFG.title;
$('title').textContent = CFG.title;
const nFill = DATA.features.filter(f => f.properties.Hfill).length;
$('count').textContent = DATA.features.length.toLocaleString() + ' 棟' + (nFill ? '（うち高さを補った建物 ' + nFill.toLocaleString() + ' 棟）' : '');
// 凡例（QGIS の色分けの名前・色と、書き出した件数）
const sw = (color, op) => '<span class="sw" style="background:' + esc(color) + (op ? ';opacity:' + op : '') + '"></span>';
$('legend').innerHTML =
  CFG.legend.map(it => '<div>' + sw(it.color) + '<span>' + esc(it.label) + '</span><span class="cnt">' + it.count.toLocaleString() + '</span></div>').join('') +
  (nFill ? '<div class="fill">' + sw(CFG.legend.length === 1 ? CFG.legend[0].color : '#9aa5b1', .45) + '半透明：高さが空のため ' + esc(CFG.defaultHeight) + ' m で表示</div>' : '');
// 凡例の高さ：画面の半分まで、かつ左上の操作パネルに重ならない高さまで（中はスクロール）
function fitLegend() {
  const room = innerHeight - $('panel').getBoundingClientRect().bottom - 28 - 12 - $('legendHead').offsetHeight - 8;
  $('legend').style.maxHeight = Math.max(60, Math.min(innerHeight / 2, room)) + 'px';
}
addEventListener('resize', fitLegend);
fitLegend();
$('legendHead').onclick = () => {
  const open = $('legend').hidden;
  $('legend').hidden = !open;
  $('legendTg').textContent = open ? 'たたむ' : 'ひらく';
  $('legendHead').setAttribute('aria-expanded', open);
};

// ---- 輪郭線（屋根のふち） ----
// fill-extrusion には輪郭線がなく、地面に引いた線は3Dでは建物に隠れる。
// そこで各辺に沿った細い帯を作り、屋根の高さに薄く載せて「ふち」として見せる。
// 帯の幅は画面上で1ピクセル弱になるよう、ズームに合わせて作り直す。
const RIM_LIFT = 0.3;  // 屋根から帯を持ち上げる高さ（m）
let exag = 1;          // 高さの強調（倍率）
function rimWidth(zoom) {
  const lat = (CFG.bbox[1] + CFG.bbox[3]) / 2;
  const mPerPx = 78271.517 * Math.cos(lat * Math.PI / 180) / Math.pow(2, zoom);
  return Math.min(2.5, Math.max(0.2, mPerPx * 0.8));
}
function makeRims(w) {
  const features = [];
  for (const f of DATA.features) {
    const g = f.geometry, polys = g.type === 'Polygon' ? [g.coordinates] : g.coordinates;
    const quads = [];
    for (const poly of polys) for (const ring of poly) {
      const kx = 111320 * Math.cos(ring[0][1] * Math.PI / 180), ky = 110574;  // 度→m
      for (let i = 0; i < ring.length - 1; i++) {
        const [x1, y1] = ring[i], [x2, y2] = ring[i + 1];
        const dx = (x2 - x1) * kx, dy = (y2 - y1) * ky, len = Math.hypot(dx, dy);
        if (len === 0) continue;
        // 辺に直角な向きに ±w/2 ずらした細長い四角
        const ox = -dy / len * w / 2 / kx, oy = dx / len * w / 2 / ky;
        quads.push([[[x1 + ox, y1 + oy], [x2 + ox, y2 + oy], [x2 - ox, y2 - oy], [x1 - ox, y1 - oy], [x1 + ox, y1 + oy]]]);
      }
    }
    if (quads.length) features.push({type: 'Feature', id: f.id, properties: {H: f.properties.H},
                                     geometry: {type: 'MultiPolygon', coordinates: quads}});
  }
  return {type: 'FeatureCollection', features};
}
const rimTop = () => ['+', ['*', exag, ['get', 'H']], RIM_LIFT];
const rimBase = () => ['*', exag, ['get', 'H']];

const map = new maplibregl.Map({
  container: 'map',
  bounds: CFG.bbox,
  fitBoundsOptions: {padding: 60},
  maxPitch: 70,
  dragRotate: false,          // 北を上に固定
  pitchWithRotate: false,
  attributionControl: false,
  style: {
    version: 8,
    sources: {
      pale: {type: 'raster', tiles: ['https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png'],
             tileSize: 256, maxzoom: 18,
             attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">地理院タイル</a>'},
      b: {type: 'geojson', data: DATA},
      rim: {type: 'geojson', data: {type: 'FeatureCollection', features: []}}
    },
    layers: [
      {id: 'bg', type: 'background', paint: {'background-color': css('--ground')}},
      {id: 'pale', type: 'raster', source: 'pale', paint: {'raster-opacity': .35, 'raster-saturation': -.2}},
      // 高さのある建物
      {id: 'bx', type: 'fill-extrusion', source: 'b', filter: ['!', ['has', 'Hfill']],
       paint: {'fill-extrusion-color': ['case', ['boolean', ['feature-state', 'sel'], false], css('--sel'), ['get', 'C']],
               'fill-extrusion-height': ['get', 'H'], 'fill-extrusion-opacity': .92, 'fill-extrusion-vertical-gradient': true}},
      // 高さを補った建物（半透明）
      {id: 'bxFill', type: 'fill-extrusion', source: 'b', filter: ['has', 'Hfill'],
       paint: {'fill-extrusion-color': ['case', ['boolean', ['feature-state', 'sel'], false], css('--sel'), ['get', 'C']],
               'fill-extrusion-height': ['get', 'H'], 'fill-extrusion-opacity': .45}},
      // 輪郭線（屋根のふち）。選んだ建物は強調色
      {id: 'rim', type: 'fill-extrusion', source: 'rim',
       paint: {'fill-extrusion-color': ['case', ['boolean', ['feature-state', 'sel'], false], css('--sel-line'), css('--rim')],
               'fill-extrusion-base': rimBase(), 'fill-extrusion-height': rimTop(), 'fill-extrusion-opacity': .7}},
      // 選んだ建物の輪郭（地面）
      {id: 'selLine', type: 'line', source: 'b', filter: ['==', ['id'], -1],
       paint: {'line-color': css('--sel-line'), 'line-width': 3}}
    ]
  }
});
map.touchZoomRotate.disableRotation();
map.keyboard.disableRotation();
map.once('load', () => map.easeTo({pitch: PITCH_3D, duration: 0}));

// ズームが変わったら帯の幅を作り直す（幅が2割以上変わるときだけ）
let rimW = 0;
function updateRims() {
  if (!map.getSource('rim')) return;  // 読み込みが終わる前のズームは、読み込み後に作る
  const w = rimWidth(map.getZoom());
  if (rimW && Math.abs(w / rimW - 1) < 0.2) return;
  rimW = w;
  map.getSource('rim').setData(makeRims(w));
  if (sel != null) map.setFeatureState({source: 'rim', id: sel}, {sel: true});
}
map.on('styledata', updateRims);  // 背景の読み込み完了（load）を待たずに作る
map.on('zoomend', updateRims);

map.addControl(new maplibregl.NavigationControl({showCompass: false}), 'top-right');

// 2D／3D 切り替え
class DimControl {
  onAdd(m) {
    const box = document.createElement('div');
    box.className = 'maplibregl-ctrl maplibregl-ctrl-group';
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'dim';
    const upd = () => { const is3 = m.getPitch() > 5; b.textContent = is3 ? '2D' : '3D';
      b.title = is3 ? '真上から見る（2D）' : '斜めから見る（3D）'; b.setAttribute('aria-label', b.title); };
    b.onclick = () => m.easeTo({pitch: m.getPitch() > 5 ? 0 : PITCH_3D, bearing: 0, duration: 600});
    m.on('pitchend', upd); upd();
    box.appendChild(b); return box;
  }
  onRemove() {}
}
map.addControl(new DimControl(), 'top-right');
map.addControl(new maplibregl.AttributionControl({compact: false, customAttribution: CFG.attribution}), 'bottom-right');

// 背景地図が1枚も読めない（オフラインなど）ときだけ知らせる。建物は表示を続ける。
// 一部の場所に地図の画像がないだけ（取得に失敗）なら知らせない
let tileOk = false;
map.on('data', e => { if (e.sourceId === 'pale' && e.tile) { tileOk = true; $('bmNote').hidden = true; } });
map.on('error', e => { if (e.sourceId === 'pale' && !tileOk && $('bmNote').hidden) { $('bmNote').hidden = false; fitLegend(); } });

// 高さの強調
document.querySelectorAll('[data-ex]').forEach(btn => btn.onclick = () => {
  const k = +btn.dataset.ex, h = k === 1 ? ['get', 'H'] : ['*', k, ['get', 'H']];
  exag = k;
  map.setPaintProperty('bx', 'fill-extrusion-height', h);
  map.setPaintProperty('bxFill', 'fill-extrusion-height', h);
  map.setPaintProperty('rim', 'fill-extrusion-base', rimBase());
  map.setPaintProperty('rim', 'fill-extrusion-height', rimTop());
  document.querySelectorAll('[data-ex]').forEach(x => x.setAttribute('aria-pressed', x === btn));
});

// 背景地図と濃さ
document.querySelectorAll('[data-bm]').forEach(btn => btn.onclick = () => {
  map.setLayoutProperty('pale', 'visibility', btn.dataset.bm === 'pale' ? 'visible' : 'none');
  document.querySelectorAll('[data-bm]').forEach(x => x.setAttribute('aria-pressed', x === btn));
});
$('bmOp').oninput = e => { const v = +e.target.value; $('bmOpV').textContent = v + '%'; map.setPaintProperty('pale', 'raster-opacity', v / 100); };

// クリックで選択・詳細パネル
let sel = null;
function clearSel() {
  if (sel != null) {
    map.setFeatureState({source: 'b', id: sel}, {sel: false});
    map.setFeatureState({source: 'rim', id: sel}, {sel: false});
  }
  sel = null;
  map.setFilter('selLine', ['==', ['id'], -1]);
  $('side').hidden = true;
}
function pick(f) {
  if (sel === f.id) { clearSel(); return; }   // もう一度クリックで解除
  clearSel();
  sel = f.id;
  map.setFeatureState({source: 'b', id: sel}, {sel: true});
  map.setFeatureState({source: 'rim', id: sel}, {sel: true});
  map.setFilter('selLine', ['==', ['id'], sel]);
  const p = f.properties;
  // 詳細の列（項目名は別名）。値が空なら「—」。最後に3D表示に使った高さを足す
  const rows = (CFG.columns || []).map(([key, label]) => [label, p[key] == null || p[key] === '' ? '—' : p[key]]);
  rows.push(['3D表示の高さ', p.H + ' m' + (p.Hfill ? '（高さが空のため既定値）' : '')]);
  const name = CFG.nameKey && p[CFG.nameKey] != null && p[CFG.nameKey] !== '' ? p[CFG.nameKey] : '建物 ' + (sel + 1);
  $('sideBody').innerHTML = '<h2>' + esc(name) + '</h2><dl>' +
    rows.map(r => '<dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd>').join('') + '</dl>';
  $('side').hidden = false;
}
for (const id of ['bx', 'bxFill']) {
  map.on('click', id, e => { e.preventDefault(); pick(e.features[0]); });
  map.on('mouseenter', id, () => map.getCanvas().style.cursor = 'pointer');
  map.on('mouseleave', id, () => map.getCanvas().style.cursor = '');
}
map.on('click', e => { if (!e.defaultPrevented) clearSel(); });
$('sideX').onclick = clearSel;
addEventListener('keydown', e => { if (e.key === 'Escape') clearSel(); });
</script>
</body>
</html>
